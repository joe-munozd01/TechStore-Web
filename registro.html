<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/formularios.js"></script>
</head>
<body>

    <header>
        <h1><a href="index.html">TechStore</a></h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="registro.html">Registrarse</a></li>
                <li><a href="soporte.html">Soporte</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="registro">
            <h2>Crear cuenta en TechStore</h2>

            <form id="formulario_registro">
                <fieldset>
                    <legend>Datos de la cuenta</legend>

                    <label for="cnombre">Nombre completo:</label>
                    <input type="text" name="cnombre" id="cnombre" placeholder="Juan Pérez" autocomplete="name">
                    <span id="mensaje_nombre" class="mensaje-error"></span>

                    <label for="ccorreo">Correo electrónico:</label>
                    <input type="text" name="ccorreo" id="ccorreo" placeholder="juan.perez@correo.cl" autocomplete="email">
                    <span id="mensaje_correo" class="mensaje-error"></span>

                    <label for="cpassword">Contraseña:</label>
                    <input type="password" name="cpassword" id="cpassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password">

                    <label for="cpassword2">Confirmar contraseña:</label>
                    <input type="password" name="cpassword2" id="cpassword2" placeholder="Repite la contraseña" autocomplete="new-password">
                    <span id="mensaje_password" class="mensaje-error"></span>

                    <br><br>
                    <button type="reset" id="blimpiar">Limpiar</button>
                    <button type="button" id="bprocesar" onclick="procesarRegistro()">Registrarme</button>

                    <p id="mensaje_resultado"></p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>TechStore &copy; 2026 - Proyecto académico 011D Desarrollo FullStack II</p>
        <p>Contacto: contacto@techstore.cl | <a href="soporte.html">Centro de soporte</a></p>
    </footer>

</body>
</html>
